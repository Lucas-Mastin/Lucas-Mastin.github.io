<title>Stick Stacks</title>

<style>
  .dropdown {
  position: relative;
  display: inline-block;
}

.dropbtn {
  background-color: #0d6efd;
  color: white;
  padding: 0.75rem 1.5rem;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: white;
  min-width: 160px;
  z-index: 1;
}

.dropdown:hover .dropdown-content {
  display: block;
}
.dropbtn::after {
  content: " ▼";
}
body {
  background-color: #6CF475; /*light-neon green*/
  max-width: 700px;
  margin: 0 auto;
  padding: 0 20px;
}

h1 {
  color: #254FB1;  /*dark blue*/
  text-align: center;
  font-family: Garamond, serif;
}

h2 {
  color: #0A1A38; /*VERY dark blue*/
  text-align: center;
  font-family: Georgia, serif;
}

p {
  color: white;
  text-align: center;
  font-family: Georgia, serif;
}

ul {
  color: white;
  text-align: center;
  font-family: Georgia, serif;
  font-style: italic;
  list-style-position: inside;
}

.button-list {
  list-style: none;
  padding: 0;
  margin: 20px auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}

.FNAF_button-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.75rem 1.5rem;
  font-size: 1rem;
  font-weight: 600;
  text-decoration: none;
  color: #fff;
  background-color: #254FB1; /*dark blue*/
  border: 1px solid transparent;
  border-radius: 6px;
  cursor: pointer;
}

.FNAF_button-link:hover {
  background-color: #254FB1; /*dark blue*/
}

img {
  display: block;
  margin: auto;
  width: 90%;
  max-width: 350px;
  height: auto;
  border-radius: 30%; /*round corners*/
  border: 7px solid #f4fd72; /*yellow*/
}

a {
  color: #ffa500;
}
</style>
</head>

      <a href="https://irv77.github.io/hd_fnaf/ps/" class="FNAF_button-link">FNAF Pizzeria Simulator</a>
      <a href="https://irv77.github.io/hd_fnaf/ucn/" class="FNAF_button-link">FNAF Ultimate Custom Night</a>
    </div>
